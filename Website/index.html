<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Range Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="projects">
    <div id="rs-mock-banner" class="mock-banner hidden">
        <span class="mock-banner-icon">⚠</span>
        <span>Mock Mode — not connected to range</span>
    </div>

    <div class="app">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <div class="view-header">
                <div>
                    <h1>Range Projects</h1>
                    <p class="view-subtitle">Subnet allocations and project status</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="btn-refresh" title="Refresh">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M14 8A6 6 0 112 8a6 6 0 0112 0z" stroke="currentColor" stroke-width="1.5"/><path d="M14 3v5h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Refresh
                    </button>
                    <a class="btn btn-primary" href="new-project.html" title="Create New Project">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        New Project
                    </a>
                    <button class="btn btn-secondary" id="btn-command-palette" title="Command Palette (Ctrl+K)">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 3l6 5-6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Commands
                    </button>
                </div>
            </div>
            <div id="projects-grid" class="projects-grid">
                <div class="loading-state" style="grid-column: 1 / -1; height: 200px;">
                    <div class="spinner"></div>
                    <p>Loading projects…</p>
                </div>
            </div>
        </main>
    </div>

    <script src="common.js"></script>
    <script src="pages/projects.js"></script>
</body>
</html>
